name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: kivy/buildozer-action@master
      with:
        filename: buildozer.spec
        release: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RvenSMS-APK
        path: bin/*.apk
